[package]
name = "dndrom-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "DnDRom desktop shell"

[lib]
name = "dndrom_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dndrom-domain = { path = "../../../crates/domain" }
dndrom-local-runtime = { path = "../../../crates/local-runtime" }
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
thiserror.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "json"] }
keyring = "3"
